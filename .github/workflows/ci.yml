name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gg
          POSTGRES_PASSWORD: gg
          POSTGRES_DB: gg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gg -d gg_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gg:gg@localhost:5432/gg_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e . && pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
      - name: Migrations apply cleanly
        env:
          APP_ENV: production
          SECRET_KEY: ci-only-not-secret-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://gg:gg@localhost:5432/gg_test
          REDIS_URL: redis://localhost:6379/0
          FLASK_APP: wsgi.py
        run: flask db upgrade
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.lock

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gg-web:${{ github.sha }} .
