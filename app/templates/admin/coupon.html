{% extends "admin/_base.html" %}
{% block title %}{{ 'Edit ' ~ coupon.code if coupon else 'New coupon' }} · Administration{% endblock %}
{% block admin_body %}<header class="gg-admin__header"><div><p class="gg-eyebrow">Coupon</p><h1>{{ coupon.code if coupon else 'New coupon' }}</h1></div></header>{% if error %}<p class="gg-alert gg-alert--error" role="alert">{{ error }}</p>{% endif %}<form class="gg-admin__form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Code<input name="code" maxlength="40" value="{{ request.form.get('code', coupon.code if coupon else '') }}" required></label><label>Type<select name="discount_type">{% for kind in discount_types %}<option value="{{ kind.value }}"{% if request.form.get('discount_type', coupon.discount_type.value if coupon else 'percent') == kind.value %} selected{% endif %}>{{ kind.value|title }}</option>{% endfor %}</select></label><label>Amount (cents for fixed; whole percent for percent)<input name="amount" type="number" min="1" value="{{ request.form.get('amount', coupon.amount if coupon else '') }}" required></label><label>Minimum subtotal in cents<input name="minimum_subtotal_cents" type="number" min="0" value="{{ request.form.get('minimum_subtotal_cents', coupon.minimum_subtotal_cents if coupon else 0) }}"></label><label>Maximum uses (blank for unlimited)<input name="max_uses" type="number" min="1" value="{{ request.form.get('max_uses', coupon.max_uses if coupon and coupon.max_uses else '') }}"></label><label>Starts on<input name="starts_at" type="date" value="{{ request.form.get('starts_at', coupon.starts_at.strftime('%Y-%m-%d') if coupon and coupon.starts_at else '') }}"></label><label>Ends on<input name="ends_at" type="date" value="{{ request.form.get('ends_at', coupon.ends_at.strftime('%Y-%m-%d') if coupon and coupon.ends_at else '') }}"></label><label class="gg-check"><input type="checkbox" name="active" value="1"{% if request.form.get('active') or (not request.form and (not coupon or coupon.active)) %} checked{% endif %}> Active</label><button class="gg-button gg-button--accent" type="submit">Save coupon</button></form>{% endblock %}
