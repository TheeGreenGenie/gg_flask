{% extends "admin/_base.html" %}
{% block title %}Administrator Sign In · GG Afrikan Eleganz{% endblock %}
{% block admin_body %}
<form class="gg-admin__login" method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p class="gg-eyebrow">Private administration</p><h1>Administrator sign in</h1>
  {% if error %}<p class="gg-form-error" role="alert">{{ error }}</p>{% endif %}
  <div class="gg-field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required></div>
  <div class="gg-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="gg-button gg-button--accent gg-button--block" type="submit">Continue</button>
</form>
{% endblock %}
