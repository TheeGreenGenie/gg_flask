{% extends "admin/_base.html" %}
{% block title %}Edit {{ variant.sku }} · Administration{% endblock %}
{% block admin_body %}
<header class="gg-admin__header"><div><p class="gg-eyebrow">Variant</p><h1>{{ variant.sku }}</h1><p><a href="{{ url_for('admin.product_edit', product_id=variant.product.id) }}">{{ variant.product.name }}</a></p></div></header>
<form class="gg-admin__form" method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if error %}<p class="gg-form-error" role="alert">{{ error }}</p>{% endif %}<div class="gg-fields"><div class="gg-field"><label for="sku">SKU</label><input id="sku" name="sku" value="{{ variant.sku }}" maxlength="64" required></div><div class="gg-field"><label for="price">Price</label><input id="price" name="price" value="{{ '%.2f'|format(variant.price_cents / 100) }}" inputmode="decimal" required></div><div class="gg-field"><label for="compare">Compare-at price</label><input id="compare" name="compare_at" value="{{ '%.2f'|format(variant.compare_at_cents / 100) if variant.compare_at_cents else '' }}" inputmode="decimal"></div><div class="gg-field"><label for="stock">Stock</label><input id="stock" name="stock" type="number" min="0" value="{{ variant.stock_quantity }}" required></div><div class="gg-field"><label for="weight">Weight in grams</label><input id="weight" name="weight_grams" type="number" min="1" value="{{ variant.weight_grams or '' }}"></div></div><label class="gg-check"><input type="checkbox" name="track_inventory" value="1"{% if variant.track_inventory %} checked{% endif %}> Track inventory</label><label class="gg-check"><input type="checkbox" name="active" value="1"{% if variant.active %} checked{% endif %}> Available for sale</label><button class="gg-button gg-button--accent" type="submit">Save variant</button></form>
{% endblock %}
