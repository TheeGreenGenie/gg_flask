{#- Inline SVG icons. Decorative by default; give the parent control an accessible name. -#}
{% macro icon(name, size=20) -%}
<svg class="gg-icon gg-icon--{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
  {%- if name in ('facebook', 'pinterest', 'tiktok') %} fill="currentColor"{% else %} fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"{% endif %}>
{%- if name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'user' -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
{%- elif name == 'cart' -%}<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>
{%- elif name == 'menu' -%}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'close' -%}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'chevron-down' -%}<path d="m6 9 6 6 6-6"/>
{%- elif name == 'chevron-left' -%}<path d="m15 6-6 6 6 6"/>
{%- elif name == 'chevron-right' -%}<path d="m9 6 6 6-6 6"/>
{%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'minus' -%}<path d="M5 12h14"/>
{%- elif name == 'trash' -%}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
{%- elif name == 'truck' -%}<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>
{%- elif name == 'lock' -%}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'heart' -%}<path d="M12 20.5s-7.4-4.5-9.4-9C1.2 8.3 3.2 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.7 0 5.7 3.8 4.3 7-2 4.5-9.4 9-9.4 9z"/>
{%- elif name == 'sun' -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
{%- elif name == 'check' -%}<path d="m5 12 5 5 9-10"/>
{%- elif name == 'mail' -%}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif name == 'instagram' -%}<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>
{%- elif name == 'facebook' -%}<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
{%- elif name == 'pinterest' -%}<path d="M12 2C6.5 2 2 6.5 2 12c0 4.2 2.6 7.8 6.4 9.3-.1-.8-.2-2 0-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.9 0 1.3.6 1.3 1.4 0 .9-.5 2.1-.8 3.3-.2 1 .5 1.8 1.5 1.8 1.8 0 3.1-1.9 3.1-4.6 0-2.4-1.7-4.1-4.2-4.1-2.8 0-4.5 2.1-4.5 4.3 0 .9.3 1.8.7 2.3.1.1.1.2.1.3l-.3 1.1c0 .2-.1.2-.3.1-1.2-.6-2-2.4-2-3.9 0-3.2 2.3-6.1 6.6-6.1 3.5 0 6.2 2.5 6.2 5.8 0 3.4-2.2 6.2-5.2 6.2-1 0-2-.5-2.3-1.1l-.6 2.4c-.2.9-.8 2-1.2 2.6.9.3 1.9.4 2.9.4 5.5 0 10-4.5 10-10S17.5 2 12 2z"/>
{%- elif name == 'tiktok' -%}<path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.3V2h-3.4v13.7a2.9 2.9 0 1 1-2.1-2.8V9.4a6.3 6.3 0 1 0 5.5 6.3V8.7a8.2 8.2 0 0 0 4.8 1.5V6.8z"/>
{%- endif -%}
</svg>
