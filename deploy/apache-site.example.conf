# Apache 2.4 site for the Flask app. Copy to /etc/apache2/sites-available/ggafrikaneleganz.conf,
# replace the REPLACE_* values, then: sudo a2enmod proxy proxy_http headers rewrite ssl expires
# && sudo a2ensite ggafrikaneleganz && sudo apachectl configtest && sudo systemctl reload apache2
# Get the certificate first: sudo certbot --apache -d REPLACE_DOMAIN
# The private-path and file-protection rules live in deploy/htaccess.example — paste them inside
# the 443 VirtualHost below (VirtualHost config is preferred over .htaccess).

<VirtualHost *:80>
    ServerName REPLACE_DOMAIN
    # Everything moves to HTTPS (permanent, method-preserving).
    Redirect 308 / https://REPLACE_DOMAIN/
</VirtualHost>

<VirtualHost *:443>
    ServerName REPLACE_DOMAIN

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem

    # Requests larger than this never reach the app. 16 MB leaves room for the 15 MB photo
    # uploads (app/uploads.py); every other form is limited to 2 MB inside Flask.
    LimitRequestBody 16777216

    # --- Static files and media straight from disk (faster; set SERVE_MEDIA=0 in the env file) ---
    Alias /static/ /srv/gg_flask/app/static/
    <Directory /srv/gg_flask/app/static/>
        Require all granted
        Options -Indexes
        Header always set X-Content-Type-Options "nosniff"
        # URLs carry ?v=<fingerprint>, so they can be cached for a year; others for an hour.
        Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=/"
        Header set Cache-Control "public, max-age=3600" "expr=! %{QUERY_STRING} =~ /(^|&)v=/"
    </Directory>

    Alias /media/ /srv/gg_flask/instance/media/
    <Directory /srv/gg_flask/instance/media/>
        Require all granted
        Options -Indexes
        # Same protection Flask adds: media can never run script, even an SVG opened directly.
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
        Header always set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=/"
        Header set Cache-Control "public, max-age=604800" "expr=! %{QUERY_STRING} =~ /(^|&)v=/"
    </Directory>

    # --- Technical admin area: owner's network only (replace with your IP or VPN range) ---
    <Location /admin>
        Require ip REPLACE_OWNER_IP
    </Location>

    # --- Everything else goes to gunicorn on localhost ---
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /static/ !
    ProxyPass        /media/  !
    ProxyPass        /        http://127.0.0.1:8000/ timeout=35
    ProxyPassReverse /        http://127.0.0.1:8000/
    # Tells Flask the original request was HTTPS (pair with TRUSTED_PROXY_HOPS=1).
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/gg-flask-error.log
    CustomLog ${APACHE_LOG_DIR}/gg-flask-access.log combined
</VirtualHost>
