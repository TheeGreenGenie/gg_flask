# Local development services. Not used for staging or production.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gg
      POSTGRES_PASSWORD: gg
      POSTGRES_DB: gg_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gg -d gg_dev"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    build: .
    profiles: ["full"]
    environment:
      APP_ENV: production
      SECRET_KEY: local-compose-only-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://gg:gg@db:5432/gg_dev
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
