[project]
name = "gg-afrikan-eleganz"
version = "0.1.0"
description = "GG Afrikan Eleganz storefront (Flask rebuild)"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "flask-wtf>=1.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "gunicorn>=23.0",
    "pyyaml>=6.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]
# Design/QA helpers (scripts/): prototype image prep and responsive screenshots.
tools = [
    "playwright>=1.49",
    "pymysql>=1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
